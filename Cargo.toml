[workspace]
resolver = "2"
members = [
    "crates/strata",
    "crates/strata_dom",
    "crates/strata_macro",
    "crates/strata_style",
    "crates/strata_layout",
    "crates/strata_render",
    "crates/strata_js",
    "crates/strata_platform",
    "crates/strata_device",
    "crates/strata_codegen_js",
    "crates/strata_cli",
    "crates/strata_devtools",
    "crates/strata_icons",
    "crates/strata_ui",
    "crates/strata_primitives",
    "crates/strata_vfs",
    "crates/strata_storage",
    "crates/strata_web_api",
    "crates/strata_parallel",
    "crates/strata_tui",
    "crates/strata_mobile_test",
    "crates/strata_sim",
    "crates/strata_lsp",
    "crates/strata_mdbook",
    "crates/strata_a11y",
    "crates/strata_gpu_path",
    "crates/strata_crdt",
    "crates/strata_agent_ui",
    "crates/strata_audio",
    "crates/strata_plugin_runtime",
    "crates/strata_hot_reload",
    "examples/saas_dashboard",
    "examples/ecommerce_storefront",
    "examples/creative_studio",
    "examples/eda_studio",
]

[workspace.package]
version = "0.1.0"
authors = ["larvance <64753457+larvance@users.noreply.github.com>"]
edition = "2021"
license = "MIT"
repository = "https://github.com/larvance/strata"
homepage = "https://github.com/larvance/strata"
documentation = "https://docs.rs/strata"
keywords = ["gui", "frontend", "framework", "css", "tailwind"]
categories = ["gui", "web-programming", "rendering"]

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
