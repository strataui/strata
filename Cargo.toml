[workspace]
resolver = "2"
members = [
    "crates/strata",
    "crates/core/*",
    "crates/render/*",
    "crates/runtime/*",
    "crates/ui/*",
    "crates/tooling/*",
    "crates/harnesses/*",
    "examples/*",
]

[workspace.package]
version = "0.1.0"
authors = ["Strata Contributors"]
edition = "2021"
license = "MIT"
repository = "https://github.com/strataui/strata"
homepage = "https://github.com/strataui/strata"
documentation = "https://docs.rs/strata"
keywords = ["gui", "frontend", "framework", "css", "tailwind"]
categories = ["gui", "web-programming", "rendering"]

[workspace.dependencies]
# Facade
strata = { path = "crates/strata" }

# Core
strata_primitives = { path = "crates/core/strata_primitives" }
strata_dom = { path = "crates/core/strata_dom" }
strata_style = { path = "crates/core/strata_style" }
strata_layout = { path = "crates/core/strata_layout" }
strata_macro = { path = "crates/core/strata_macro" }
strata_aria = { path = "crates/core/strata_aria" }

# Render
strata_render = { path = "crates/render/strata_render" }
strata_gpu_path = { path = "crates/render/strata_gpu_path" }
strata_platform = { path = "crates/render/strata_platform" }
strata_tui = { path = "crates/render/strata_tui" }
strata_audio = { path = "crates/render/strata_audio" }

# Runtime
strata_js = { path = "crates/runtime/strata_js" }
strata_codegen_js = { path = "crates/runtime/strata_codegen_js" }
strata_web_api = { path = "crates/runtime/strata_web_api" }
strata_vfs = { path = "crates/runtime/strata_vfs" }
strata_storage = { path = "crates/runtime/strata_storage" }
strata_store = { path = "crates/runtime/strata_store" }
strata_crdt = { path = "crates/runtime/strata_crdt" }
strata_plugin_runtime = { path = "crates/runtime/strata_plugin_runtime" }
strata_ffi = { path = "crates/runtime/strata_ffi" }
strata_router = { path = "crates/runtime/strata_router" }
strata_device = { path = "crates/runtime/strata_device" }
strata_parallel = { path = "crates/runtime/strata_parallel" }
strata_web_reader = { path = "crates/runtime/strata_web_reader" }

# UI
strata_ui = { path = "crates/ui/strata_ui" }
strata_icons = { path = "crates/ui/strata_icons" }
strata_table = { path = "crates/ui/strata_table" }
strata_virtual = { path = "crates/ui/strata_virtual" }
strata_form = { path = "crates/ui/strata_form" }
strata_toast = { path = "crates/ui/strata_toast" }
strata_motion = { path = "crates/ui/strata_motion" }
strata_charts = { path = "crates/ui/strata_charts" }
strata_editor = { path = "crates/ui/strata_editor" }
strata_agent_ui = { path = "crates/ui/strata_agent_ui" }
strata_a11y = { path = "crates/ui/strata_a11y" }
strata_i18n = { path = "crates/ui/strata_i18n" }
strata_query = { path = "crates/ui/strata_query" }

# Tooling
strata_devtools = { path = "crates/tooling/strata_devtools" }
strata_build = { path = "crates/tooling/strata_build" }
strata_hot_reload = { path = "crates/tooling/strata_hot_reload" }
strata_mcp = { path = "crates/tooling/strata_mcp" }

# Harnesses
strata_parity_tauri = { path = "crates/harnesses/strata_parity_tauri" }
strata_mobile_test = { path = "crates/harnesses/strata_mobile_test" }
strata_sim = { path = "crates/harnesses/strata_sim" }
strata_benchmark = { path = "crates/harnesses/strata_benchmark" }
strata_chromium_surface = { path = "crates/harnesses/strata_chromium_surface" }

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
