[workspace]
resolver = "2"
members = [
    "crates/strata",
    "crates/core/*",
    "crates/render/*",
    "crates/io/*",
    "crates/runtime/*",
    "crates/tooling/*",
    "tests_crates/*",
]

[workspace.package]
version = "0.1.0"
authors = ["Strata Contributors"]
edition = "2021"
license = "MIT"
repository = "https://github.com/strataui/strata"
homepage = "https://github.com/strataui/strata"
documentation = "https://docs.rs/strata-ui"
keywords = ["gui", "frontend", "framework", "css", "tailwind"]
categories = ["gui", "web-programming", "rendering"]

[workspace.dependencies]
# Facade
strata-ui = { path = "crates/strata", version = "0.1.5" }

# Core
strata-primitives = { path = "crates/core/strata_primitives", version = "0.1.0" }
strata-dom = { path = "crates/core/strata_dom", version = "0.1.3" }
strata-style = { path = "crates/core/strata_style", version = "0.1.1" }
strata-layout = { path = "crates/core/strata_layout", version = "0.1.1" }
strata-macro = { path = "crates/core/strata_macro", version = "0.1.3" }
strata-a11y = { path = "crates/core/strata_a11y", version = "0.1.2" }

# Render
strata-render = { path = "crates/render/strata_render", version = "0.1.3" }
strata-gpu-path = { path = "crates/render/strata_gpu_path", version = "0.1.1" }
strata-ui-platform = { path = "crates/render/strata_platform", version = "0.1.3" }

# Universal I/O
strata-audio = { path = "crates/io/strata_audio", version = "0.2.0", default-features = false }
strata-media = { path = "crates/io/strata_media", version = "0.1.0" }
strata-hardware = { path = "crates/io/strata_hardware", version = "0.1.0" }
strata-tui = { path = "crates/io/strata_tui", version = "0.2.0" }

# Runtime
strata-js = "0.1.1"
strata-web-api = { path = "crates/runtime/strata_web_api", version = "0.1.1" }
strata-vfs = { path = "crates/runtime/strata_vfs", version = "0.1.0" }
strata-storage = { path = "crates/runtime/strata_storage", version = "0.1.0" }
strata-device = { path = "crates/runtime/strata_device", version = "0.1.1" }
strata-parallel = { path = "crates/runtime/strata_parallel", version = "0.1.0" }
strata-ffi = { path = "crates/runtime/strata_ffi", version = "0.1.1" }

# Tooling
strata-devtools = { path = "crates/tooling/strata_devtools", version = "0.1.1" }
strata-hot-reload = { path = "crates/tooling/strata_hot_reload", version = "0.1.1" }

# Internal Non-Publish QA Harnesses
strata-parity-tauri = { path = "tests_crates/strata_parity_tauri", version = "0.1.0" }

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
