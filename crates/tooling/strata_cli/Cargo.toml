[package]
name = "strata_cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Universal Developer CLI and Cross-Platform Packaging Toolchain for Strata"

[lib]
path = "src/lib.rs"

[[bin]]
name = "strata"
path = "src/main.rs"

[dependencies]
strata = { workspace = true }
strata_dom = { workspace = true }
strata_codegen_js = { workspace = true }
strata_mobile_test = { workspace = true }
strata_sim = { workspace = true }
strata_mcp = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
flate2 = "1.0"



