[package]
name = "strata_lsp"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Strata Language Server Protocol (LSP 3.17) implementation in pure Rust"

[[bin]]
name = "strata-lsp"
path = "src/main.rs"

[lib]
name = "strata_lsp"
path = "src/lib.rs"

[dependencies]
strata_style = { workspace = true }
strata_ui = { workspace = true }
strata_primitives = { workspace = true }
strata_js = { workspace = true }
tree-sitter = "0.27.2"
tree-sitter-rust = "0.24.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
