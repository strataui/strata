[package]
name = "strata-parity-tauri"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Parity Verification Harness between Strata Pure Rust Engine and Tauri WebKitGTK"
repository.workspace = true
homepage.workspace = true
documentation.workspace = true

[features]
default = []
tauri-backend = ["dep:tauri", "dep:tauri-build"]

[dependencies]
strata-ui = { workspace = true, features = ["mobile-test"] }
strata-dom = { workspace = true }
strata-style = { workspace = true }
strata-layout = { workspace = true }
strata-render = { workspace = true }
strata-ui-platform = { workspace = true }
strata-mobile-test = { workspace = true }
strata-web-reader = { workspace = true }
tauri = { version = "2.1.1", optional = true }
gtk = "0.18.2"
cairo-rs = "0.18.5"
image = { version = "0.25", default-features = false, features = ["png"] }

[build-dependencies]
tauri-build = { version = "2.1.1", optional = true }
