[package]
name = "strata-ui"
version = "0.1.5"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"
description = "Universal frontend framework in pure Rust with pixel-perfect CSS emulation and React/TSX ergonomics"

[lib]
name = "strata"
path = "src/lib.rs"

[dependencies]
# Core mandatory primitives & runtime
strata-dom = { workspace = true }
strata-macro = { workspace = true }
strata-style = { workspace = true }
strata-layout = { workspace = true }
strata-render = { workspace = true }
strata-js = { workspace = true }
strata-ui-platform = { workspace = true }
strata-primitives = { workspace = true }
strata-vfs = { workspace = true }
strata-storage = { workspace = true }
strata-web-api = { workspace = true }
strata-gpu-path = { workspace = true }
strata-a11y = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Core optional engine capabilities
strata-device = { workspace = true, optional = true }
strata-audio = { workspace = true, optional = true }
strata-media = { workspace = true, optional = true }
strata-hardware = { workspace = true, optional = true }
strata-tui = { workspace = true, optional = true }
strata-parallel = { workspace = true, optional = true }
strata-devtools = { workspace = true, optional = true }
strata-hot-reload = { workspace = true, optional = true }

[features]
default = ["tailwind", "device", "audio-dsp", "pdf"]
tailwind = []
device = ["dep:strata-device"]
audio-dsp = ["dep:strata-audio"]
audio = ["audio-dsp", "strata-audio/hardware", "strata-audio/reactive"]
audio-codecs = ["audio", "strata-audio/codecs"]
media = ["dep:strata-media"]
hardware = ["dep:strata-hardware"]
tui = ["dep:strata-tui"]
pdf = ["strata-render/pdf"]
parallel = ["dep:strata-parallel"]
devtools = ["dep:strata-devtools"]
hot-reload = ["dep:strata-hot-reload"]
profiling = []
a11y = []
full-io = [
    "device",
    "audio",
    "audio-codecs",
    "media",
    "hardware",
    "tui",
    "pdf",
]
full = [
    "tailwind",
    "full-io",
    "parallel",
    "devtools",
    "hot-reload",
    "a11y",
]

[dev-dependencies]
strata-device = { workspace = true }
strata-devtools = { workspace = true }

[[test]]
name = "cdp_integration_tests"
required-features = ["devtools"]

[[test]]
name = "hmr_runtime_tests"
required-features = ["hot-reload"]

[[example]]
name = "readme_hero"
path = "../../examples/readme_hero.rs"

[[example]]
name = "voice_studio_demo"
path = "../../examples/voice_studio_demo.rs"
required-features = ["full-io"]

[[example]]
name = "universal_io_cockpit"
path = "../../examples/universal_io_cockpit.rs"
required-features = ["full-io"]
