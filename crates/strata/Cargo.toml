[package]
name = "strata"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Universal frontend framework in pure Rust with pixel-perfect CSS emulation and React/TSX ergonomics"

[dependencies]
# Core mandatory primitives & runtime
strata_dom = { workspace = true }
strata_macro = { workspace = true }
strata_style = { workspace = true }
strata_layout = { workspace = true }
strata_render = { workspace = true }
strata_js = { workspace = true }
strata_platform = { workspace = true }
strata_primitives = { workspace = true }
strata_vfs = { workspace = true }
strata_storage = { workspace = true }
strata_web_api = { workspace = true }
strata_gpu_path = { workspace = true }
strata_a11y = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Decoupled optional ecosystem crates
strata_ui = { workspace = true, optional = true }
strata_icons = { workspace = true, optional = true }
strata_device = { workspace = true, optional = true }
strata_parallel = { workspace = true, optional = true }
strata_tui = { workspace = true, optional = true }
strata_codegen_js = { workspace = true, optional = true }
strata_devtools = { workspace = true, optional = true }
strata_mobile_test = { workspace = true, optional = true }
strata_sim = { workspace = true, optional = true }
strata_audio = { workspace = true, optional = true }

strata_crdt = { workspace = true, optional = true }
strata_agent_ui = { workspace = true, optional = true }
strata_i18n = { workspace = true, optional = true }
strata_router = { workspace = true, optional = true }
strata_form = { workspace = true, optional = true }
strata_query = { workspace = true, optional = true }
strata_virtual = { workspace = true, optional = true }
strata_aria = { workspace = true, optional = true }
strata_store = { workspace = true, optional = true }
strata_toast = { workspace = true, optional = true }
strata_motion = { workspace = true, optional = true }
strata_table = { workspace = true, optional = true }
strata_charts = { workspace = true, optional = true }
strata_editor = { workspace = true, optional = true }

[features]
default = ["tailwind", "device"]
tailwind = []
ui = ["dep:strata_ui"]
icons = ["dep:strata_icons"]
i18n = ["dep:strata_i18n"]
router = ["dep:strata_router"]
form = ["dep:strata_form"]
query = ["dep:strata_query"]
virtual = ["dep:strata_virtual"]
aria = ["dep:strata_aria"]
store = ["dep:strata_store"]
toast = ["dep:strata_toast"]
motion = ["dep:strata_motion"]
table = ["dep:strata_table"]
charts = ["dep:strata_charts"]
editor = ["dep:strata_editor"]
device = ["dep:strata_device"]
parallel = ["dep:strata_parallel"]
tui = ["dep:strata_tui"]
codegen-js = ["dep:strata_codegen_js"]
devtools = ["dep:strata_devtools"]
mobile-test = ["dep:strata_mobile_test"]
sim = ["dep:strata_sim"]
a11y = []
audio = ["dep:strata_audio"]

crdt = ["dep:strata_crdt"]
agent-ui = ["dep:strata_agent_ui"]
full = [
    "ui",
    "icons",
    "i18n",
    "router",
    "form",
    "query",
    "virtual",
    "aria",
    "store",
    "toast",
    "motion",
    "table",
    "charts",
    "editor",
    "device",
    "parallel",
    "tui",
    "codegen-js",
    "devtools",
    "mobile-test",
    "sim",
    "a11y",
    "audio",
    "crdt",
    "agent-ui",
]

[dev-dependencies]
strata_ui = { workspace = true }
strata_icons = { workspace = true }
strata_device = { workspace = true }
strata_web_reader = { workspace = true }
strata_devtools = { workspace = true }
strata_aria = { workspace = true }



[[test]]
name = "cdp_integration_tests"
required-features = ["devtools"]

[[example]]
name = "readme_hero"
path = "../../examples/readme_hero.rs"


