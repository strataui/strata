[package]
name = "strata-ui"
version = "0.1.4"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"
description = "Universal frontend framework in pure Rust with pixel-perfect CSS emulation and React/TSX ergonomics"

[lib]
name = "strata"
path = "src/lib.rs"

[dependencies]
# Core mandatory primitives & runtime
strata-dom = { workspace = true }
strata-macro = { workspace = true }
strata-style = { workspace = true }
strata-layout = { workspace = true }
strata-render = { workspace = true }
strata-js = { workspace = true }
strata-ui-platform = { workspace = true }
strata-primitives = { workspace = true }
strata-vfs = { workspace = true }
strata-storage = { workspace = true }
strata-web-api = { workspace = true }
strata-gpu-path = { workspace = true }
strata-a11y = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Decoupled optional ecosystem crates
strata-components = { workspace = true, optional = true }
strata-icons = { workspace = true, optional = true }
strata-device = { workspace = true, optional = true }
strata-parallel = { workspace = true, optional = true }
strata-tui = { workspace = true, optional = true }
strata-codegen-js = { workspace = true, optional = true }
strata-devtools = { workspace = true, optional = true }
strata-mobile-test = { workspace = true, optional = true }
strata-sim = { workspace = true, optional = true }
strata-audio = { workspace = true, optional = true }

strata-crdt = { workspace = true, optional = true }
strata-agent-ui = { workspace = true, optional = true }
strata-i18n = { workspace = true, optional = true }
strata-router = { workspace = true, optional = true }
strata-form = { workspace = true, optional = true }
strata-query = { workspace = true, optional = true }
strata-virtual = { workspace = true, optional = true }
strata-aria = { workspace = true, optional = true }
strata-ui-store = { workspace = true, optional = true }
strata-toast = { workspace = true, optional = true }
strata-motion = { workspace = true, optional = true }
strata-table = { workspace = true, optional = true }
strata-charts = { workspace = true, optional = true }
strata-editor = { workspace = true, optional = true }

[features]
default = ["tailwind", "device"]
tailwind = []
ui = ["dep:strata-components"]
icons = ["dep:strata-icons"]
i18n = ["dep:strata-i18n"]
router = ["dep:strata-router"]
form = ["dep:strata-form"]
query = ["dep:strata-query"]
virtual = ["dep:strata-virtual"]
aria = ["dep:strata-aria"]
store = ["dep:strata-ui-store"]
toast = ["dep:strata-toast"]
motion = ["dep:strata-motion"]
table = ["dep:strata-table"]
charts = ["dep:strata-charts"]
editor = ["dep:strata-editor"]
device = ["dep:strata-device"]
parallel = ["dep:strata-parallel"]
tui = ["dep:strata-tui"]
codegen-js = ["dep:strata-codegen-js"]
devtools = ["dep:strata-devtools"]
mobile-test = ["dep:strata-mobile-test"]
sim = ["dep:strata-sim"]
a11y = []
audio = ["dep:strata-audio"]

crdt = ["dep:strata-crdt"]
agent-ui = ["dep:strata-agent-ui"]
full = [
    "ui",
    "icons",
    "i18n",
    "router",
    "form",
    "query",
    "virtual",
    "aria",
    "store",
    "toast",
    "motion",
    "table",
    "charts",
    "editor",
    "device",
    "parallel",
    "tui",
    "codegen-js",
    "devtools",
    "mobile-test",
    "sim",
    "a11y",
    "audio",
    "crdt",
    "agent-ui",
]

[dev-dependencies]
strata-components = { workspace = true }
strata-icons = { workspace = true }
strata-device = { workspace = true }
strata-web-reader = { workspace = true }
strata-devtools = { workspace = true }
strata-aria = { workspace = true }



[[test]]
name = "cdp_integration_tests"
required-features = ["devtools"]

[[example]]
name = "readme_hero"
path = "../../examples/readme_hero.rs"


