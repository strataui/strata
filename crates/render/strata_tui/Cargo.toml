[package]
name = "strata_tui"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Terminal User Interface (TUI) target backend for Strata"

[dependencies]
strata_dom = { workspace = true }
strata_style = { workspace = true }
strata_layout = { workspace = true }
strata_primitives = { workspace = true }
strata_platform = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_System_Console",
] }
