[package]
name = "strata-render"
version = "0.1.1"
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "High-performance Display List, Stacking Context Compositor, and GPU rasterization pipeline"
repository.workspace = true
homepage.workspace = true
documentation.workspace = true

[dependencies]
strata-primitives = { workspace = true }
strata-style = { workspace = true }
strata-layout = { workspace = true }
strata-dom = { workspace = true }
strata-macro = { workspace = true }
strata-js = { workspace = true }
strata-gpu-path = { workspace = true }
miniz_oxide = { version = "0.8", default-features = false, features = ["with-alloc"] }
wgpu = { version = "24.0", optional = true }
bytemuck = { version = "1.25", features = ["derive"], optional = true }
pollster = { version = "0.4", optional = true }

[features]
default = ["wgpu-backend"]
gpu = []
wgpu-backend = ["dep:wgpu", "dep:bytemuck", "dep:pollster"]

