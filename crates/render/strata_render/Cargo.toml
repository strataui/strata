[package]
name = "strata_render"
version = "0.1.1"
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "High-performance Display List, Stacking Context Compositor, and GPU rasterization pipeline"
repository.workspace = true
homepage.workspace = true
documentation.workspace = true

[dependencies]
strata_primitives = { workspace = true }
strata_style = { workspace = true }
strata_layout = { workspace = true }
strata_dom = { workspace = true }
strata_macro = { workspace = true }
strata_js = { workspace = true }
strata_gpu_path = { workspace = true }
miniz_oxide = { version = "0.8", default-features = false, features = ["with-alloc"] }
wgpu = { version = "24.0", optional = true }
bytemuck = { version = "1.25", features = ["derive"], optional = true }
pollster = { version = "0.4", optional = true }

[features]
default = ["wgpu-backend"]
gpu = []
wgpu-backend = ["dep:wgpu", "dep:bytemuck", "dep:pollster"]

