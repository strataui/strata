[package]
name = "strata_platform"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Native Hardware Abstraction Layer for Android, iOS, macOS, Windows, Linux, and Web"

[dependencies]
strata_render = { workspace = true }
strata_style = { workspace = true }
strata_primitives = { workspace = true }
strata_layout = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
x11 = { version = "2.21", features = ["xlib"] }
gtk = "0.18.2"
cairo-rs = { version = "0.18.5", features = ["png"] }
pangocairo = "0.18.0"
pango = { version = "0.18.0", features = ["v1_44"] }
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Controls_Dialogs",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_System_LibraryLoader",
] }

