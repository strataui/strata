[package]
name = "strata-ui-platform"
version = "0.1.1"
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Native Hardware Abstraction Layer for Android, iOS, macOS, Windows, Linux, and Web"
repository.workspace = true
homepage.workspace = true
documentation.workspace = true

[lib]
name = "strata_platform"
path = "src/lib.rs"

[dependencies]
strata-render = { workspace = true }
strata-style = { workspace = true }
strata-primitives = { workspace = true }
strata-layout = { workspace = true }
wgpu = { version = "24.0", optional = true }
pollster = { version = "0.4", optional = true }
raw-window-handle = { version = "0.6", optional = true }

[features]
default = ["gtk-compat", "xlib", "wgpu-backend"]
gtk-compat = ["dep:gtk", "dep:cairo-rs", "dep:pangocairo", "dep:pango"]
xlib = ["dep:x11"]
wgpu-backend = ["dep:wgpu", "dep:pollster", "dep:raw-window-handle", "strata-render/wgpu-backend"]
test-internals = []

[dev-dependencies]
strata-ui-platform = { path = ".", features = ["test-internals"] }

[target.'cfg(target_os = "linux")'.dependencies]
x11 = { version = "2.21", features = ["xlib"], optional = true }
gtk = { version = "0.18.2", optional = true }
cairo-rs = { version = "0.18.5", features = ["png"], optional = true }
pangocairo = { version = "0.18.0", optional = true }
pango = { version = "0.18.0", features = ["v1_44"], optional = true }
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Controls_Dialogs",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_System_LibraryLoader",
] }

