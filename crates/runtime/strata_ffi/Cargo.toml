[package]
name = "strata-ffi"
version = "0.1.2"
edition.workspace = true
authors.workspace = true
description = "Universal C-compatible Foreign Function Interface (FFI) and embeddable dynamic/static library for Strata"
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/strata-ffi"
keywords.workspace = true
categories.workspace = true
readme = "README.md"

[lib]
crate-type = ["lib", "cdylib", "staticlib"]

[dependencies]
strata-ui = { workspace = true }
strata-dom = { workspace = true }
strata-style = { workspace = true }
strata-layout = { workspace = true }
strata-render = { workspace = true }
strata-ui-platform = { workspace = true }
strata-primitives = { workspace = true }
