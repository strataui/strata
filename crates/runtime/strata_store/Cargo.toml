[package]
name = "strata-ui-store"
version.workspace = true
edition = "2021"
description = "Lightweight Signal-Driven Global State Store for Strata"
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true

[lib]
name = "strata_store"
path = "src/lib.rs"

[dependencies]
strata-dom = { workspace = true }
strata-macro = { workspace = true }
strata-storage = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
